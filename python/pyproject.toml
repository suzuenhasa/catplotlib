[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catplotlib"
version = "0.5.1"
description = "Cozy Matplotlib themes and tiny, genuinely vector cats."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.10,<4", "numpy>=1.23"]

[tool.setuptools.packages.find]
include = ["catplotlib*"]

[tool.setuptools.package-data]
catplotlib = ["*.mplstyle", "assets/*.svg"]
